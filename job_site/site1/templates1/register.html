{% extends 'base.html' %}
{% load static %}
{% block content %}
    <!-- Content -->
    <div class="page-content">
        <!-- inner page banner -->
        <div class="dez-bnr-inr overlay-black-middle bg-pt" style="background-image:url(images/banner/bnr2.jpg);">
            <div class="container">
                <div class="dez-bnr-inr-entry">
                    <h1 class="text-white">Register</h1>
					<!-- Breadcrumb row -->
					<div class="breadcrumb-row">
						<ul class="list-inline">
							<li><a href="/">Home</a></li>
							<li>Register</li>
						</ul>
					</div>
					<!-- Breadcrumb row END -->
                </div>
            </div>
        </div>
        <!-- inner page banner END -->
        <!-- contact area -->
        <div class="section-full content-inner browse-job bg-white shop-account">
            <!-- Product -->
            <div class="container">
                <div class="row">
					<div class="col-md-12 m-b30">
						<div class="card max-w500 radius-sm m-auto">
							<div class="tab-content">
								<form id="login" class="tab-pane active" method="POST" enctype="multipart/form-data">
									{% csrf_token %}
									<h4 class="font-weight-700 m-b5">PERSONAL INFORMATION</h4>
									<p class="font-weight-600">If you have an account with us, please log in.</p>
									<div class="form-group">
										<label class="font-weight-700">First Name *</label>
										<input name="dzName" required="" class="form-control" placeholder="First Name" type="text">
									</div>
									<div class="form-group">
										<label class="font-weight-700">Last Name *</label>
										<input name="dzLname" required="" class="form-control" placeholder="Last Name" type="text">
									</div>
									<div class="form-group">
										<label class="font-weight-700">Username *</label>
										<input name="username" required="" class="form-control" placeholder="Your username Address" type="text">
									</div>
									<div class="form-group">
										<label class="font-weight-700">Email *</label>
										<input name="email" required="" class="form-control" placeholder="you@example.com" type="email">
									</div>
									<div class="form-group">
										<label class="font-weight-700">Password *</label>
										<input id="password-input" name="dzPassword" required="" class="form-control" placeholder="Type Password" type="password" autocomplete="new-password">
										<div id="password-strength" class="small m-t5 text-muted">Strength: <span id="password-strength-value">Low</span></div>
									</div>
									<div class="text-left">
										<button class="site-button button-lg outline outline-2">CREATE</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
            <!-- Product END -->
		</div>
		<!-- contact area  END -->
    </div>
    <!-- Content END-->
	<script>
		(function () {
			var passwordInput = document.getElementById('password-input');
			var strengthValue = document.getElementById('password-strength-value');
			if (!passwordInput || !strengthValue) return;

			function getStrength(password) {
				var score = 0;
				if (password.length >= 8) score += 1;
				if (/[A-Z]/.test(password)) score += 1;
				if (/[0-9]/.test(password)) score += 1;
				if (/[^A-Za-z0-9]/.test(password)) score += 1;

				if (password.length >= 12 && score >= 3) return 'Strong';
				if (password.length >= 8 && score >= 2) return 'Medium';
				return 'Low';
			}

			function updateStrength() {
				var strength = getStrength(passwordInput.value || '');
				strengthValue.textContent = strength;
				strengthValue.classList.remove('text-danger', 'text-warning', 'text-success');
				if (strength === 'Low') strengthValue.classList.add('text-danger');
				if (strength === 'Medium') strengthValue.classList.add('text-warning');
				if (strength === 'Strong') strengthValue.classList.add('text-success');
			}

			passwordInput.addEventListener('input', updateStrength);
			updateStrength();
		})();
	</script>
{% endblock%}
