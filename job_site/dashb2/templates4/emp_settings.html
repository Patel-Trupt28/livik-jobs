{% extends 'emp_base1.html' %}
{% load static %}
{% block content %}
      <div class="box-content">
        <div class="box-heading">
          <div class="box-title">
            <h3 class="mb-35">Setting</h3>
          </div>
          <div class="box-breadcrumb">
            <div class="breadcrumbs">
              <ul>
                <li> <a class='icon-home' href='/dashboard2/emp_index/'>Admin</a></li>
                <li><span>Setting</span></li>
              </ul>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-xxl-9 col-xl-8 col-lg-8">
            <div class="section-box">
              <div class="container">
                <div class="panel-white mb-30">
                  <div class="box-padding">
                    <h6 class="color-text-paragraph-2">Security</h6>
                    <form method="POST" class="row mt-20">
                      {% csrf_token %}
                      <input type="hidden" name="action" value="security">
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-30">
                          <label class="font-sm color-text-mutted mb-10">Current Password</label>
                          <input class="form-control" type="password" name="current_password" placeholder="Enter current password">
                        </div>
                      </div>
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-30">
                          <label class="font-sm color-text-mutted mb-10">New Password</label>
                          <input class="form-control" type="password" name="new_password" placeholder="Enter new password">
                        </div>
                      </div>
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-30">
                          <label class="font-sm color-text-mutted mb-10">Confirm New Password</label>
                          <input class="form-control" type="password" name="confirm_password" placeholder="Confirm new password">
                        </div>
                      </div>
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-30">
                          <label class="font-sm color-text-mutted mb-10">Two-Factor Authentication</label>
                          <div class="d-flex align-items-center gap-2">
                            <input id="twofactor-toggle" type="checkbox" name="two_factor_enabled" {% if settings_obj.two_factor_enabled %}checked{% endif %}>
                            <label class="font-sm color-text-mutted mb-0" for="twofactor-toggle">Enable 2FA</label>
                          </div>
                        </div>
                      </div>
                      <div class="col-lg-12">
                        <div class="form-group mt-10">
                          <button class="btn btn-default btn-brand icon-tick" type="submit">Save Security Settings</button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
                <div class="panel-white mb-30">
                  <div class="box-padding">
                    <h6 class="color-text-paragraph-2">Notifications</h6>
                    <form method="POST" class="row mt-20">
                      {% csrf_token %}
                      <input type="hidden" name="action" value="notifications">
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-20">
                          <div class="d-flex align-items-center gap-2">
                            <input id="notify-email-jobs" type="checkbox" name="notify_email_jobs" {% if settings_obj.notify_email_jobs %}checked{% endif %}>
                            <label class="font-sm color-text-mutted mb-0" for="notify-email-jobs">Email me about new jobs</label>
                          </div>
                        </div>
                        <div class="form-group mb-20">
                          <div class="d-flex align-items-center gap-2">
                            <input id="notify-email-apps" type="checkbox" name="notify_email_applications" {% if settings_obj.notify_email_applications %}checked{% endif %}>
                            <label class="font-sm color-text-mutted mb-0" for="notify-email-apps">Email me about applications</label>
                          </div>
                        </div>
                        <div class="form-group mb-20">
                          <div class="d-flex align-items-center gap-2">
                            <input id="notify-email-news" type="checkbox" name="notify_email_news" {% if settings_obj.notify_email_news %}checked{% endif %}>
                            <label class="font-sm color-text-mutted mb-0" for="notify-email-news">Product updates and news</label>
                          </div>
                        </div>
                      </div>
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-20">
                          <div class="d-flex align-items-center gap-2">
                            <input id="notify-sms" type="checkbox" name="notify_sms" {% if settings_obj.notify_sms %}checked{% endif %}>
                            <label class="font-sm color-text-mutted mb-0" for="notify-sms">SMS notifications</label>
                          </div>
                        </div>
                        <div class="form-group mb-20">
                          <div class="d-flex align-items-center gap-2">
                            <input id="notify-browser" type="checkbox" name="notify_browser" {% if settings_obj.notify_browser %}checked{% endif %}>
                            <label class="font-sm color-text-mutted mb-0" for="notify-browser">Browser notifications</label>
                          </div>
                        </div>
                      </div>
                      <div class="col-lg-12">
                        <div class="form-group mt-10">
                          <button class="btn btn-default btn-brand icon-tick" type="submit">Save Notification Settings</button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
                <div class="panel-white mb-30">
                  <div class="box-padding">
                    <h6 class="color-text-paragraph-2">Privacy & Visibility</h6>
                    <form method="POST" class="row mt-20">
                      {% csrf_token %}
                      <input type="hidden" name="action" value="privacy">
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-30">
                          <label class="font-sm color-text-mutted mb-10">Profile Visibility</label>
                          <select class="form-control" name="profile_visibility">
                            <option value="public" {% if settings_obj.profile_visibility == 'public' %}selected{% endif %}>Public</option>
                            <option value="private" {% if settings_obj.profile_visibility == 'private' %}selected{% endif %}>Private</option>
                            <option value="recruiters" {% if settings_obj.profile_visibility == 'recruiters' %}selected{% endif %}>Recruiters only</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-30">
                          <label class="font-sm color-text-mutted mb-10">Show Email</label>
                          <select class="form-control" name="show_email">
                            <option value="yes" {% if settings_obj.show_email %}selected{% endif %}>Yes</option>
                            <option value="no" {% if not settings_obj.show_email %}selected{% endif %}>No</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-lg-12">
                        <div class="form-group mb-20">
                          <div class="d-flex align-items-center gap-2">
                            <input id="search-engine" type="checkbox" name="allow_search_index" {% if settings_obj.allow_search_index %}checked{% endif %}>
                            <label class="font-sm color-text-mutted mb-0" for="search-engine">Allow search engines to index my profile</label>
                          </div>
                        </div>
                      </div>
                      <div class="col-lg-12">
                        <div class="form-group mt-10">
                          <button class="btn btn-default btn-brand icon-tick" type="submit">Save Privacy Settings</button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
                <div class="panel-white mb-30">
                  <div class="box-padding">
                    <h6 class="color-text-paragraph-2">Preferences</h6>
                    <form method="POST" class="row mt-20">
                      {% csrf_token %}
                      <input type="hidden" name="action" value="preferences">
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-30">
                          <label class="font-sm color-text-mutted mb-10">Theme</label>
                          <select class="form-control" name="theme_preference">
                            <option value="system" {% if settings_obj.theme_preference == 'system' %}selected{% endif %}>System default</option>
                            <option value="light" {% if settings_obj.theme_preference == 'light' %}selected{% endif %}>Light</option>
                            <option value="dark" {% if settings_obj.theme_preference == 'dark' %}selected{% endif %}>Dark</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-30">
                          <label class="font-sm color-text-mutted mb-10">Language</label>
                          <select class="form-control" name="language">
                            <option value="en" {% if settings_obj.language == 'en' %}selected{% endif %}>English</option>
                            <option value="hi" {% if settings_obj.language == 'hi' %}selected{% endif %}>Hindi</option>
                            <option value="gu" {% if settings_obj.language == 'gu' %}selected{% endif %}>Gujarati</option>
                            <option value="es" {% if settings_obj.language == 'es' %}selected{% endif %}>Spanish</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-lg-6 col-md-6">
                        <div class="form-group mb-30">
                          <label class="font-sm color-text-mutted mb-10">Time Zone</label>
                          <select class="form-control" name="timezone">
                            <option value="Asia/Kolkata" {% if settings_obj.timezone == 'Asia/Kolkata' %}selected{% endif %}>Asia/Kolkata (IST)</option>
                            <option value="UTC" {% if settings_obj.timezone == 'UTC' %}selected{% endif %}>UTC</option>
                            <option value="America/New_York" {% if settings_obj.timezone == 'America/New_York' %}selected{% endif %}>America/New_York (EST)</option>
                            <option value="Europe/London" {% if settings_obj.timezone == 'Europe/London' %}selected{% endif %}>Europe/London (GMT)</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-lg-12">
                        <div class="form-group mt-10">
                          <button class="btn btn-default btn-brand icon-tick" type="submit">Save Preferences</button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-xxl-3 col-xl-4 col-lg-4">
            <div class="section-box">
              <div class="container">
                <div class="panel-white">
                  <div class="panel-head">
                    <h5>Account Status</h5>
                  </div>
                  <div class="panel-body pt-20">
                    <form method="POST" class="row">
                      {% csrf_token %}
                      <input type="hidden" name="action" value="account">
                      <div class="col-12">
                        <div class="form-group mb-20">
                          <div class="d-flex align-items-center gap-2">
                            <input id="account-active" type="checkbox" name="account_active" {% if settings_obj.account_active %}checked{% endif %}>
                            <label class="font-sm color-text-mutted mb-0" for="account-active">Account active</label>
                          </div>
                        </div>
                      </div>
                      <div class="col-12">
                        <div class="form-group mb-20">
                          <button class="btn btn-default btn-brand w-100 icon-tick" type="submit">Save Account Settings</button>
                        </div>
                      </div>
                      <div class="col-12">
                        <div class="form-group">
                          <button class="btn btn-danger w-100" type="button">Deactivate Account</button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
{% endblock %}
